name: Publish HGNC studies to S3
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

concurrency:
  group: publish-hgnc-master
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'cbioportal-curation-gene-update/datahub' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.inventory.outputs.batches }}
      revision: ${{ steps.inventory.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          sparse-checkout: .github
      - uses: ./.github/actions/hgnc-publisher
        with:
          saml_idp_provider: ${{ secrets.SAML_IDP_PROVIDER }}
          saml_mfa: ${{ secrets.SAML_MFA }}
          saml_url: ${{ secrets.SAML_URL }}
          saml_username: ${{ secrets.SAML_USERNAME }}
          saml_aws_urn: ${{ secrets.SAML_AWS_URN }}
          saml_session_duration: ${{ secrets.SAML_SESSION_DURATION }}
          saml_password: ${{ secrets.SAML_PASSWORD }}
          saml_role: ${{ secrets.SAML_ROLE }}
      - id: inventory
        run: python .github/scripts/hgnc_studies.py plan

  publish:
    needs: plan
    if: needs.plan.outputs.batches != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.revision }}
          sparse-checkout: .github
      - uses: ./.github/actions/hgnc-publisher
        with:
          saml_idp_provider: ${{ secrets.SAML_IDP_PROVIDER }}
          saml_mfa: ${{ secrets.SAML_MFA }}
          saml_url: ${{ secrets.SAML_URL }}
          saml_username: ${{ secrets.SAML_USERNAME }}
          saml_aws_urn: ${{ secrets.SAML_AWS_URN }}
          saml_session_duration: ${{ secrets.SAML_SESSION_DURATION }}
          saml_password: ${{ secrets.SAML_PASSWORD }}
          saml_role: ${{ secrets.SAML_ROLE }}
      - run: python .github/scripts/hgnc_studies.py publish
        env:
          STUDIES: ${{ toJSON(matrix.studies) }}

  index:
    needs: [plan, publish]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.revision }}
          sparse-checkout: .github
      - uses: ./.github/actions/hgnc-publisher
        with:
          saml_idp_provider: ${{ secrets.SAML_IDP_PROVIDER }}
          saml_mfa: ${{ secrets.SAML_MFA }}
          saml_url: ${{ secrets.SAML_URL }}
          saml_username: ${{ secrets.SAML_USERNAME }}
          saml_aws_urn: ${{ secrets.SAML_AWS_URN }}
          saml_session_duration: ${{ secrets.SAML_SESSION_DURATION }}
          saml_password: ${{ secrets.SAML_PASSWORD }}
          saml_role: ${{ secrets.SAML_ROLE }}
      - run: python .github/scripts/hgnc_studies.py index
